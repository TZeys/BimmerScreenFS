<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" font-family="Helvetica, Arial, sans-serif">
  <rect width="980" height="660" fill="#ffffff"/>

  <text x="24" y="32" font-size="19" font-weight="700" fill="#111">BimmerScreenFS wiring</text>
  <text x="24" y="52" font-size="12.5" fill="#555">BMW F22 220d (N47D20C) | headunit connector A42x1B | single 500 kbit/s bus, listen only</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- ================= car connector ================= -->
  <rect x="24" y="86" width="176" height="214" rx="6" fill="#f4f6f8" stroke="#222" stroke-width="1.6"/>
  <text x="112" y="108" font-size="12.5" font-weight="700" text-anchor="middle" fill="#111">Headunit connector</text>
  <text x="112" y="124" font-size="11" text-anchor="middle" fill="#666">A42x1B</text>

  <rect x="38" y="136" width="148" height="30" rx="4" fill="#fff" stroke="#c0392b" stroke-width="1.3"/>
  <text x="48" y="149" font-size="11.5" font-weight="700" fill="#c0392b">pin 15</text>
  <text x="48" y="161" font-size="10" fill="#933">12V, terminal 30</text>

  <rect x="38" y="174" width="148" height="26" rx="4" fill="#fff" stroke="#555" stroke-width="1.3"/>
  <text x="48" y="191" font-size="11.5" font-weight="700" fill="#333">pin 12   GND</text>

  <rect x="38" y="212" width="148" height="26" rx="4" fill="#fff" stroke="#2980b9" stroke-width="1.3"/>
  <text x="48" y="229" font-size="11.5" font-weight="700" fill="#2980b9">pin 11   CAN HIGH</text>

  <rect x="38" y="246" width="148" height="26" rx="4" fill="#fff" stroke="#2980b9" stroke-width="1.3"/>
  <text x="48" y="263" font-size="11.5" font-weight="700" fill="#2980b9">pin 9    CAN LOW</text>

  <text x="112" y="290" font-size="9.5" text-anchor="middle" fill="#888">pin 15 fused at 20 A for the head unit</text>

  <!-- ================= fuse ================= -->
  <rect x="248" y="96" width="122" height="40" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.6"/>
  <text x="309" y="113" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">inline fuse</text>
  <text x="309" y="127" font-size="10.5" text-anchor="middle" fill="#933">1 to 2 A</text>

  <!-- ================= buck ================= -->
  <rect x="248" y="160" width="122" height="62" rx="6" fill="#fff8f0" stroke="#e67e22" stroke-width="1.8"/>
  <text x="309" y="182" font-size="12.5" font-weight="700" text-anchor="middle" fill="#111">LM2596</text>
  <text x="309" y="197" font-size="10.5" text-anchor="middle" fill="#666">buck converter</text>
  <text x="309" y="212" font-size="10.5" font-weight="700" text-anchor="middle" fill="#e67e22">12V to 5.0V</text>

  <!-- ================= transceiver ================= -->
  <rect x="248" y="268" width="122" height="104" rx="6" fill="#eef6fc" stroke="#2980b9" stroke-width="1.8"/>
  <text x="309" y="290" font-size="12.5" font-weight="700" text-anchor="middle" fill="#111">SN65HVD230</text>
  <text x="309" y="305" font-size="10" text-anchor="middle" fill="#666">CAN transceiver</text>
  <text x="258" y="326" font-size="10.5" fill="#333">CANH / CANL</text>
  <text x="258" y="342" font-size="10.5" fill="#333">RX / TX</text>
  <text x="258" y="360" font-size="10.5" font-weight="700" fill="#f39c12">VCC = 3.3V only</text>

  <!-- ================= esp32 ================= -->
  <rect x="446" y="96" width="182" height="404" rx="8" fill="#f7f7fa" stroke="#111" stroke-width="2"/>
  <text x="537" y="120" font-size="13.5" font-weight="700" text-anchor="middle" fill="#111">ESP32-C3</text>
  <text x="537" y="136" font-size="11" text-anchor="middle" fill="#666">SuperMini</text>
  <line x1="446" y1="146" x2="628" y2="146" stroke="#ccc" stroke-width="1"/>

  <text x="456" y="170" font-size="11" font-weight="700" fill="#e67e22">5V</text>
  <text x="456" y="196" font-size="11" font-weight="700" fill="#f39c12">3V3</text>
  <text x="456" y="222" font-size="11" font-weight="700" fill="#555">GND</text>

  <text x="456" y="330" font-size="11" font-weight="700" fill="#2980b9">GPIO3</text>
  <text x="456" y="356" font-size="10" fill="#777">CAN RX</text>
  <text x="456" y="386" font-size="11" font-weight="700" fill="#2980b9">GPIO5</text>
  <text x="456" y="402" font-size="10" fill="#777">CAN TX</text>
  <text x="456" y="424" font-size="9" fill="#c0392b">also default SPI MISO</text>
  <text x="456" y="436" font-size="9" fill="#c0392b">leave TFT SDO unwired</text>

  <text x="618" y="170" font-size="11" font-weight="700" text-anchor="end" fill="#27ae60">GPIO4  SCK</text>
  <text x="618" y="192" font-size="11" font-weight="700" text-anchor="end" fill="#27ae60">GPIO6  MOSI</text>
  <text x="618" y="214" font-size="11" font-weight="700" text-anchor="end" fill="#27ae60">GPIO8  CS</text>
  <text x="618" y="236" font-size="11" font-weight="700" text-anchor="end" fill="#27ae60">GPIO1  DC</text>
  <text x="618" y="252" font-size="8.5" text-anchor="end" fill="#c0392b">GPIO8 = onboard LED + strap</text>

  <text x="618" y="352" font-size="11" font-weight="700" text-anchor="end" fill="#8e44ad">GPIO20  RX</text>
  <text x="618" y="374" font-size="11" font-weight="700" text-anchor="end" fill="#8e44ad">GPIO21  TX</text>
  <text x="618" y="392" font-size="8.5" text-anchor="end" fill="#c0392b">needs USB CDC On Boot</text>
  <text x="618" y="404" font-size="8.5" text-anchor="end" fill="#c0392b">enabled, else UART0 clashes</text>

  <!-- ================= TFT ================= -->
  <rect x="706" y="96" width="188" height="150" rx="6" fill="#eefaf1" stroke="#27ae60" stroke-width="1.8"/>
  <text x="800" y="118" font-size="12.5" font-weight="700" text-anchor="middle" fill="#111">ILI9341 TFT</text>
  <text x="800" y="133" font-size="10.5" text-anchor="middle" fill="#666">2.8 in, 320x240, landscape</text>
  <text x="718" y="156" font-size="10.5" fill="#333">SCK, MOSI, CS, DC</text>
  <text x="718" y="174" font-size="10.5" font-weight="700" fill="#f39c12">VCC = 3.3V</text>
  <text x="718" y="190" font-size="10.5" font-weight="700" fill="#f39c12">LED = 3.3V, always on</text>
  <text x="718" y="208" font-size="10.5" fill="#333">RST tied to 3.3V</text>
  <text x="718" y="226" font-size="10" fill="#888">SDO not connected</text>
  <text x="718" y="240" font-size="9.5" fill="#888">no 5V, module has no regulator here</text>

  <!-- ================= DFPlayer ================= -->
  <rect x="706" y="292" width="188" height="112" rx="6" fill="#f6effa" stroke="#8e44ad" stroke-width="1.8"/>
  <text x="800" y="314" font-size="12.5" font-weight="700" text-anchor="middle" fill="#111">DFPlayer Mini</text>
  <text x="800" y="329" font-size="10.5" text-anchor="middle" fill="#666">9600 baud, 8N1</text>
  <text x="718" y="350" font-size="10.5" font-weight="700" fill="#e67e22">VCC = 5V</text>
  <text x="718" y="368" font-size="10.5" fill="#333">RX via 1k series resistor</text>
  <text x="718" y="386" font-size="10.5" fill="#333">microSD, tracks 1 to 5</text>

  <!-- ================= speaker ================= -->
  <rect x="706" y="440" width="188" height="46" rx="6" fill="#f7f7fa" stroke="#555" stroke-width="1.5"/>
  <text x="800" y="463" font-size="12" font-weight="700" text-anchor="middle" fill="#111">speaker</text>
  <text x="800" y="477" font-size="10" text-anchor="middle" fill="#666">SPK_1 / SPK_2</text>

  <!-- ================= wires ================= -->
  <!-- 12V: pin15 to fuse -->
  <polyline points="186,151 216,151 216,116 248,116" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#a)"/>
  <!-- fuse to buck -->
  <polyline points="309,136 309,160" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#a)"/>
  <!-- GND: pin12 to buck -->
  <polyline points="186,187 216,187 216,205 248,205" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <!-- buck 5V to ESP 5V -->
  <polyline points="370,180 404,180 404,166 446,166" fill="none" stroke="#e67e22" stroke-width="2.2" marker-end="url(#a)"/>
  <!-- common ground: buck to ESP GND -->
  <polyline points="370,214 420,214 420,218 446,218" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="250" y="250" font-size="9" fill="#777">all modules share this ground</text>
  <!-- buck 5V to DFPlayer VCC, routed under everything -->
  <polyline points="386,199 386,560 672,560 672,346 706,346" fill="none" stroke="#e67e22" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="386" cy="199" r="3.2" fill="#e67e22"/>

  <!-- CANH / CANL into transceiver -->
  <polyline points="186,225 212,225 212,300 248,300" fill="none" stroke="#2980b9" stroke-width="2.2" marker-end="url(#a)"/>
  <polyline points="186,259 200,259 200,316 248,316" fill="none" stroke="#2980b9" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- transceiver RX to GPIO3 -->
  <polyline points="370,326 408,326 408,326 446,326" fill="none" stroke="#2980b9" stroke-width="2.2" marker-end="url(#a)"/>
  <!-- GPIO5 to transceiver TX -->
  <polyline points="446,382 416,382 416,344 370,344" fill="none" stroke="#2980b9" stroke-width="2.2" marker-end="url(#a)"/>
  <!-- 3V3 to transceiver VCC -->
  <polyline points="446,192 430,192 430,358 370,358" fill="none" stroke="#f39c12" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="446" cy="192" r="3.2" fill="#f39c12"/>

  <!-- SPI to TFT -->
  <polyline points="628,166 668,166 668,150 706,150" fill="none" stroke="#27ae60" stroke-width="2.2" marker-end="url(#a)"/>
  <polyline points="628,188 660,188 660,158 706,158" fill="none" stroke="#27ae60" stroke-width="2.2"/>
  <polyline points="628,210 652,210 652,166 706,166" fill="none" stroke="#27ae60" stroke-width="2.2"/>
  <polyline points="628,232 644,232 644,174 706,174" fill="none" stroke="#27ae60" stroke-width="2.2"/>
  <!-- 3V3 to TFT VCC + LED : from the 3V3 stub, over the top -->
  <polyline points="446,192 438,192 438,78 690,78 690,120 706,120" fill="none" stroke="#f39c12" stroke-width="2" marker-end="url(#a)"/>

  <!-- UART to DFPlayer -->
  <polyline points="628,348 706,348" fill="none" stroke="#8e44ad" stroke-width="2.2"/>
  <polyline points="628,370 666,370 666,376 706,376" fill="none" stroke="#8e44ad" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- DFPlayer to speaker -->
  <polyline points="800,404 800,440" fill="none" stroke="#555" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- ================= legend ================= -->
  <line x1="24" y1="588" x2="956" y2="588" stroke="#ddd" stroke-width="1"/>
  <text x="24" y="608" font-size="11" font-weight="700" fill="#111">Rails</text>
  <line x1="70" y1="604" x2="98" y2="604" stroke="#c0392b" stroke-width="2.5"/><text x="104" y="608" font-size="10.5" fill="#444">12V</text>
  <line x1="136" y1="604" x2="164" y2="604" stroke="#e67e22" stroke-width="2.5"/><text x="170" y="608" font-size="10.5" fill="#444">5V</text>
  <line x1="196" y1="604" x2="224" y2="604" stroke="#f39c12" stroke-width="2.5"/><text x="230" y="608" font-size="10.5" fill="#444">3.3V</text>
  <line x1="266" y1="604" x2="294" y2="604" stroke="#555" stroke-width="2.5"/><text x="300" y="608" font-size="10.5" fill="#444">GND</text>
  <line x1="344" y1="604" x2="372" y2="604" stroke="#2980b9" stroke-width="2.5"/><text x="378" y="608" font-size="10.5" fill="#444">CAN</text>
  <line x1="420" y1="604" x2="448" y2="604" stroke="#27ae60" stroke-width="2.5"/><text x="454" y="608" font-size="10.5" fill="#444">SPI</text>
  <line x1="492" y1="604" x2="520" y2="604" stroke="#8e44ad" stroke-width="2.5"/><text x="526" y="608" font-size="10.5" fill="#444">UART</text>

  <text x="24" y="634" font-size="10.5" fill="#c0392b" font-weight="700">Terminal 30 is permanent battery. Nothing here sleeps and the backlight is hardwired on, so the module draws current while parked. See schematic.md.</text>
  <text x="24" y="650" font-size="10" fill="#777">One common ground, taken from connector pin 12. Do not add a separate chassis ground, and do not fit a 120 ohm termination resistor.</text>
</svg>
